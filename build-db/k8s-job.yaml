apiVersion: batch/v1
kind: Job
metadata:
  # Name of your job
  name: sapbert-builder
spec:
  template:
    spec:
      containers:
      - name: sapbert-builder
        # Replace with the image you want to run
        # Pinned, not :latest — this tag has the create_index perf config and
        # the --id-offset guard. digest sha256:2f146ca9ec885f...
        image: containers.renci.org/helxplatform/sapbert-build:2026-08-18
        # Replace with the command your container should run
        args:
          - "--host"
          - "sap-qdrant-v2-q1"
          - "--port"
          - "6333"
          - "--scheme"
          - "http"
          - "--index"
          - "sapbert"
          - "--root-path"
          - "/data"
          - "--folders"
#          - "mapping_conflated_2025jan23"
#          - "mapping_gene_2025jan23"
          - "mapping_other_2025jan23"
#          - "mapping_protein_2025jan23"
          - "--chunk-size"
          - "1000"
          - "--max-retries"
          - "10"
          - "--vector-size"
          - "768"
          - "--shard-number"
          - "9"
          - "--replication-factor"
          - "1"
          - "--progress-file"
          - "/data/progress.json"
          # Existing points occupy ids 419466114..420166224. Start above them.
          # Redundant while /data/progress.json survives (total_counter is
          # already 420166225), but explicit beats accidental.
          - "--id-offset"
          - "420166225"
          - "--exclude-prefixes"
          - "PUBCHEM.COMPOUND"
        resources:
          limits:
            memory: 10Gi
        volumeMounts:
        - name: shared-storage
          # The path inside the container where the volume will be mounted
          mountPath: /data
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          # This must match the name of your existing PersistentVolumeClaim
          claimName: babel-sapbert-pvc
      # Ensures the Job doesn't restart pods if they fail
      restartPolicy: Never
  # Optional: specifies how many times the Job should retry if a pod fails
  backoffLimit: 4